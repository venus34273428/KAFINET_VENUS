            onclick="showModal(
                'eitaa://eitaa.com/venus3428',
                'https://eitaa.com/venus3428'
            )">
            ایتا
        </button>

        <button class="btn bale"
            onclick="showModal(
                'bale://u/1791760676',
                'https://web.bale.ai/chat?uid=1791760676'
            )">
            بله
        </button>

        <button class="btn shad"
            onclick="showModal(
                '',
                'https://web.shad.ir/#c=u0JfKA06fcc2e1b60bd204ed06100c97'
            )">
            شاد
        </button>
    </main>

    <!-- پنجره تأیید -->
    <div class="modal-overlay" id="myModal">
        <div class="modal-box">
            <h3 id="modalTitle">باز کردن پیام‌رسان</h3>

            <p id="modalMessage">
                چگونه می‌خواهید وارد گفت‌وگو شوید؟
            </p>

            <button class="modal-btn yes"
                    id="confirmBtn"
                    onclick="openApp()">
                باز کردن اپلیکیشن
            </button>

            <button class="modal-btn web"
                    id="webBtn"
                    onclick="openWeb()">
                باز کردن نسخه وب
            </button>

            <button class="modal-btn no"
                    onclick="closeModal()">
                انصراف
            </button>
        </div>
    </div>

    <script>
        let appUrl = "";
        let fallbackUrl = "";

        function showModal(app, fallback) {
            appUrl = app || "";
            fallbackUrl = fallback || "";

            const confirmBtn = document.getElementById("confirmBtn");
            const webBtn = document.getElementById("webBtn");
            const message = document.getElementById("modalMessage");

            confirmBtn.style.display = appUrl ? "block" : "none";
            webBtn.style.display = fallbackUrl ? "block" : "none";

            if (!appUrl) {
                message.textContent =
                    "برای این پیام‌رسان فقط لینک وب تنظیم شده است.";
            } else {
                message.textContent =
                    "اپلیکیشن را باز کنید یا نسخه وب را انتخاب کنید.";
            }

            document.getElementById("myModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }

        function openApp() {
            if (!appUrl) return;

            const url = appUrl;
            closeModal();

            // فقط تلاش برای باز کردن اپلیکیشن؛
            // هدایت خودکار و زمان‌بندی‌شده به وب انجام نمی‌شود.
            window.location.href = url;
        }

        function openWeb() {
            if (!fallbackUrl) return;

            const url = fallbackUrl;
            closeModal();

            window.location.href = url;
        }

        // بستن پنجره با کلیک روی فضای بیرونی
        document.getElementById("myModal").addEventListener(
            "click",
            function(event) {
                if (event.target === this) {
                    closeModal();
                }
            }
        );
    </script>

</body>
