<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارتباط با کافی‌نت ونوس</title>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.2s;
            box-sizing: border-box;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn img {
            width: 24px;
            height: 24px;
            margin-left: 10px;
            filter: brightness(0) invert(1);
        }
        
        /* رنگ اختصاصی هر پیام‌رسان */
        .whatsapp { background-color: #25D366; }
        .telegram { background-color: #0088cc; }
        .eitaa { background-color: #ff8e00; }
        .bale { background-color: #00a8e8; }
        .shad { background-color: #6c4b9e; }

    </style>
</head>
<body>

    <div class="container">
        <h1>کافی‌نت ونوس</h1>
        <p>برای ارسال فایل، یکی از پیام‌رسان‌های زیر را انتخاب کنید:</p>

        <!-- دکمه واتساپ -->
        <a href="https://wa.me/989180056290" class="btn whatsapp" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            ارسال در واتساپ
        </a>

        <!-- دکمه تلگرام -->
        <a href="https://t.me/venus3428" class="btn telegram" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
            ارسال در تلگرام
        </a>

        <!-- دکمه ایتا -->
        <a href="https://web.eitaa.com/#@venus3428" class="btn eitaa" target="_blank">
            ارسال در ایتا
        </a>

        <!-- دکمه بله -->
        <a href="https://web.bale.ai/chat?uid=1791760676" class="btn bale" target="_blank">
            ارسال در بله
        </a>

        <!-- دکمه شاد -->
        <a href="https://web.shad.ir/#c=u0JfKA06fcc2e1b60bd204ed06100c97" class="btn shad" target="_blank">
            ارسال در شاد
        </a>
    </div>

</body>
</html>
